services:
  whoisathome:
    build: .
    container_name: whoisathome-api
    restart: unless-stopped

    environment:
      PERSONS: "person1,person2,person3,person4,person5"

    # Keine Docker-Logs speichern.
    # Dadurch landen aufgerufene URLs nicht in den Container-Logs.
    logging:
      driver: "none"
    networks:
      PrivateNetwork:
        ipv4_address: 10.20.2.16
      OpenNetwork:
        ipv4_address: 10.20.1.16

networks:
  OpenNetwork:
    external: true
  PrivateNetwork:
    external: true
